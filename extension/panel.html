<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Faktencheck lokal</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="" width="28" height="28">
  <h1>Faktencheck <span>lokal</span></h1>
  <button id="settingsBtn" type="button" class="ghost" aria-expanded="false" aria-controls="settings">Einstellungen</button>
</header>

<section id="settings" hidden>
  <label class="row">
    <input type="checkbox" id="optWiki">
    <span>
      <b>Wikipedia als Beleg heranziehen</b>
      <small>Verbessert die Treffsicherheit deutlich. Dafür werden nur die Suchbegriffe zu jeder Behauptung an wikipedia.org gesendet – der markierte Text selbst bleibt auf dem Gerät.</small>
    </span>
  </label>
  <label class="row">
    <span><b>Sprache der Antwort</b></span>
    <select id="optLang">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
    </select>
  </label>
</section>

<section id="setup" hidden>
  <h2 id="setupTitle"></h2>
  <p id="setupText"></p>
  <button id="setupBtn" type="button" class="primary" hidden>Lokales KI-Modell laden</button>
  <progress id="setupProgress" max="1" value="0" hidden></progress>
</section>

<form id="form">
  <label for="input">Text zum Prüfen</label>
  <textarea id="input" rows="5" placeholder="Text auf einer Webseite markieren → Rechtsklick → „Faktencheck“. Oder hier einfügen."></textarea>
  <div class="actions">
    <span id="count" class="muted"></span>
    <button id="stopBtn" type="button" class="ghost" hidden>Abbrechen</button>
    <button id="checkBtn" type="submit" class="primary">Prüfen</button>
  </div>
</form>

<p id="status" class="muted" role="status" aria-live="polite"></p>
<main id="results"></main>

<footer>
  Die Einschätzung stammt von einem kleinen Sprachmodell auf diesem Gerät. Es kann sich irren und kennt keine aktuellen Ereignisse – wichtige Aussagen bitte immer an den Quellen gegenprüfen.
</footer>

<script src="panel.js"></script>
</body>
</html>
